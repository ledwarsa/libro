<body>
    <div id="app"></div>

    <!-- Vue 3 via CDN (ES Module build) -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>

    <!-- Main App Module -->
    <script type="module" src="js/app.js"></script>

    <!-- Intersection Observer fallback for scroll animations -->
    <script>
      if (!CSS.supports('(animation-timeline: view()) and (animation-range: entry)')) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        setTimeout(() => {
          document.querySelectorAll(
            '.benefit-card, .about-img-wrapper, .about-content, .author-card, .testimonial-card, .pricing-card, .faq-item'
          ).forEach(el => {
            el.classList.add('reveal-fallback');
            observer.observe(el);
          });
        }, 600);
      }
    </script>
</body>
